name: ci
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review # draftからPRレビューに変わったとき
    branches:
      - main
      - develop

jobs:
  validate-agent-skills:
    if: github.event.pull_request.draft == false
    name: validate agent skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: validate agent skills
        run: yarn validate-agent-skills --changed-from=${{ github.event.pull_request.base.sha }}

  build:
    if: github.event.pull_request.draft == false
    name: ci build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GRAPHQL_SERVER_URL: ${{ vars.NEXT_PUBLIC_GRAPHQL_SERVER_URL }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: npm install # プロジェクトに必要なパッケージをダウンロードする
        run: npm install
      - name: lint # lintを回す
        run: npm run lint
      - name: next build # ビルド
        run: npm run build
