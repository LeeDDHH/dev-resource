name: ci
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review # draftからPRレビューに変わったとき
    branches:
      - main
      - develop

jobs:
  validate-agent-skills:
    if: github.event.pull_request.draft == false
    name: validate agent skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: validate agent skills
        run: yarn validate-agent-skills --changed-from=${{ github.event.pull_request.base.sha }}

  build:
    if: github.event.pull_request.draft == false
    name: ci build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GRAPHQL_SERVER_URL: ${{ vars.NEXT_PUBLIC_GRAPHQL_SERVER_URL }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup node # node環境を構築する
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Using cache # npmキャッシュを利用する
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: node_modules
        env:
          cache-name: node_modules
        with:
          path: node_modules
          key: ${{ runner.os }}-build-${{ hashFiles('.node-version') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-build-${{ env.cache-name }}-
            ${{ runner.OS }}-build-
            ${{ runner.OS }}-
      - name: Install Dependencies
        if: steps.node_modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: lint # lintを回す
        run: npm run lint
      - name: next build # ビルド
        run: npm run build
